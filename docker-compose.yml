version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: givingapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: givingapp
      POSTGRES_USER: givingapp
      POSTGRES_PASSWORD: givingapp_local_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/ShiftGiving/Data/seed_data.sql:/docker-entrypoint-initdb.d/seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U givingapp -d givingapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - givingapp-network

volumes:
  postgres_data:
    driver: local

networks:
  givingapp-network:
    driver: bridge
