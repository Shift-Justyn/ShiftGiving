name: "Build, Test, and Deploy"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-api:
    name: "Build API"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository code"
        uses: actions/checkout@v4

      - name: "Setup .NET SDK"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: "Restore dependencies"
        run: dotnet restore
        working-directory: api/ShiftGiving

      - name: "Build project"
        run: dotnet build --configuration Release --no-restore
        working-directory: api/ShiftGiving

      - name: "Run the API"
        run: |
          dotnet run --configuration Release &
          echo "API_SERVER_PID=$!" >> $GITHUB_ENV
          echo "API started with PID: $!"
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until curl --silent --fail http://localhost:5237; do echo "Waiting for API..."; sleep 2; done' || { echo "API did not start in time!"; exit 1; }
          echo "API is up!"
        working-directory: api/ShiftGiving

      - name: "Run API Tests"
        run: ./run_tests.sh
        working-directory: api
  build-web:
    name: "Build Web"
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - name: "Checkout repository code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Install React dependencies"
        run: npm install
        working-directory: web

      - name: "Build React application"
        run: npm run build
        working-directory: web

      - name: "Install serve package"
        run: npm install -g serve
        working-directory: web

      - name: "Serve Web App in background"
        id: start_web_server
        run: |
          serve ./dist -l 8080 &
          echo "WEB_SERVER_PID=$!" >> $GITHUB_ENV
          echo "Web server started with PID: $!"
          echo "Waiting for web server to be ready..."
          timeout 60s bash -c 'until curl --silent --fail http://localhost:8080; do echo "waiting for Web..."; sleep 2; done' || { echo "Web did not start in time!"; exit 1; }
          echo "Web app is up!"
        working-directory: web

      - name: "Install Playwright system dependencies"
        run: npx playwright install-deps
        working-directory: web

      - name: "Install Playwright browsers"
        run: npx playwright install
        working-directory: web

      - name: "Run Web Tests"
        run: ./run_tests.sh
        working-directory: web

      - name: "Stop the Web Server"
        if: always()
        run: |
          if [ -n "${{ env.WEB_SERVER_PID }}" ]; then
            echo "Stopping web server with PID: ${{ env.WEB_SERVER_PID }}"
            kill "${{ env.WEB_SERVER_PID }}" || true
          else
            echo "Web server PID not found. Could not stop explicitly."
          fi

      - name: "Stop the API Server"
        if: always()
        run: |
          if [ -n "${{ env.API_SERVER_PID }}" ]; then
            echo "Stopping API server with PID: ${{ env.API_SERVER_PID }}"
            kill "${{ env.API_SERVER_PID }}" || true
          else
            echo "API server PID not found. Could not stop explicitly."
          fi
  build-mobile-ios:
    name: "Build Mobile iOS"
    runs-on: macos-latest
    needs: build-api

    steps:
      - name: "Checkout repository code"
        uses: actions/checkout@v4

      - name: "Setup Flutter SDK"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: "Install Flutter dependencies"
        run: flutter pub get
        working-directory: mobile

      - name: "Build Flutter iOS IPA"
        run: flutter build ipa --release --no-codesign
        working-directory: mobile
  build-mobile-android:
    name: "Build Mobile Android"
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - name: "Checkout repository code"
        uses: actions/checkout@v4

      - name: "Setup Flutter SDK"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: "Install Flutter dependencies"
        run: flutter pub get
        working-directory: mobile

      - name: "Build Flutter Android APK"
        run: flutter build apk --release
        working-directory: mobile
