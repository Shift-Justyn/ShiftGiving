name: "Build, Test, and Deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'infrastructure/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'infrastructure/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test-api:
    name: "Build & Test API"
    runs-on: ubuntu-latest
    outputs:
      api_built: ${{ steps.build-api-status.outcome }}

    steps:
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: "Checkout repository code"
        uses: actions/checkout@v4

      - name: "Setup .NET SDK"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: "Restore dependencies"
        run: dotnet restore
        working-directory: api/ShiftGiving

      - name: "Publish API"
        id: build-api-status
        run: dotnet publish --configuration Release --output out
        working-directory: api/ShiftGiving

      - name: "Run the API in background for testing"
        env:
          JWT_SECRET: "test-secret-key-for-ci-minimum-32-characters-long"
          DATABASE_URL: "postgresql://shiftgiving:shiftgiving@localhost:5432/shiftgiving"
          ASPNETCORE_ENVIRONMENT: "Testing"
        run: |
          ASPNETCORE_URLS=http://localhost:5237 ./out/ShiftGiving &
          echo "API_SERVER_PID=$!" >> $GITHUB_ENV
          echo "API started with PID: $!"
          echo "Waiting for API to be ready..."
          timeout 60s bash -c 'until curl --silent --fail http://localhost:5237/health; do echo "Waiting for API..."; sleep 2; done' || { echo "API did not start in time!"; exit 1; }
          echo "API is up!"
        working-directory: api/ShiftGiving

      - name: "Run API Tests"
        run: ./run_tests.sh
        working-directory: api

      - name: "Stop the API Server"
        if: always()
        run: |
          if [ -n "${{ env.API_SERVER_PID }}" ]; then
            echo "Stopping API server with PID: ${{ env.API_SERVER_PID }}"
            kill "${{ env.API_SERVER_PID }}" || true
          else
            echo "API server PID not found. Could not stop explicitly."
          fi

      - name: Upload API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-out
          path: api/ShiftGiving/out
  build-and-test-web:
    name: "Build & Test Web"
    runs-on: ubuntu-latest
    needs: build-and-test-api
    outputs:
      web_built: ${{ steps.build-web-status.outcome }}

    steps:
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: "Checkout repository code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Install React dependencies"
        run: npm install
        working-directory: web

      - name: Install serve package
        run: npm install -g serve

      - name: "Build React application"
        id: build-web-status
        run: npm run build
        working-directory: web

      - name: "Setup .NET SDK for Web Test API dependency"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Download API Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-out
          path: api/ShiftGiving/out

      - name: Make API binary executable
        run: chmod +x ./out/ShiftGiving
        working-directory: api/ShiftGiving

      - name: "Run the API in background for Web Test"
        id: start_api_server_for_web
        env:
          JWT_SECRET: "test-secret-key-for-ci-minimum-32-characters-long"
          DATABASE_URL: "postgresql://shiftgiving:shiftgiving@localhost:5432/shiftgiving"
          ASPNETCORE_ENVIRONMENT: "Testing"
        run: |
          ASPNETCORE_URLS=http://localhost:5237 ./out/ShiftGiving &
          echo "API_SERVER_PID_FOR_WEB=$!" >> $GITHUB_ENV
          timeout 60s bash -c 'until curl --silent --fail http://localhost:5237/health; do echo "Waiting for API..."; sleep 2; done' || { echo "API did not start in time for Web Test!"; exit 1; }
          echo "API is up for Web Test!"
        working-directory: api/ShiftGiving

      - name: "Serve Web App in background for testing"
        id: start_web_server
        run: |
          serve ./dist -l 5500 &
          echo "WEB_SERVER_PID=$!" >> $GITHUB_ENV
          echo "Waiting for web server to be ready..."
          timeout 60s bash -c 'until curl --silent --fail http://localhost:5500; do echo "waiting for Web..."; sleep 2; done' || { echo "Web did not start in time!"; exit 1; }
          echo "Web app is up!"
        working-directory: web

      - name: "Install Playwright system dependencies"
        run: npx playwright install-deps
        working-directory: web

      - name: "Install Playwright browsers"
        run: npx playwright install
        working-directory: web

      - name: "Run Web Tests"
        run: ./run_tests.sh
        working-directory: web
        timeout-minutes: 20

      - name: "Stop the Web Server"
        if: always()
        run: |
          if [ -n "${{ env.WEB_SERVER_PID }}" ]; then
            echo "Stopping web server with PID: ${{ env.WEB_SERVER_PID }}"
            kill "${{ env.WEB_SERVER_PID }}" || true
          else
            echo "Web server PID not found. Could not stop explicitly."
          fi

      - name: "Stop the API Server for Web Test"
        if: always()
        run: |
          if [ -n "${{ env.API_SERVER_PID_FOR_WEB }}" ]; then
            echo "Stopping API server for Web Test with PID: ${{ env.API_SERVER_PID_FOR_WEB }}"
            kill "${{ env.API_SERVER_PID_FOR_WEB }}" || true
          else
            echo "API server PID for Web Test not found. Could not stop explicitly."
          fi
  build-and-test-mobile-ios:
    name: "Build & Test Mobile iOS"
    if: false  # Disabled - focusing on web only
    runs-on: macos-latest
    needs: build-and-test-api

    steps:
      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-ios-${{ hashFiles('**/pubspec.lock', '**/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-ios-

      - name: Cache iOS Simulator Runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/CoreSimulator/Devices
            ~/Library/Developer/CoreSimulator/Runtimes
          key: ${{ runner.os }}-ios-simulator-${{ hashFiles('.github/workflows/build_test_deploy.yml') }}
          restore-keys: ${{ runner.os }}-ios-simulator-

      - name: "Checkout repository code"
        uses: actions/checkout@v4

      - name: "Setup Flutter SDK"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: "Install Flutter dependencies"
        run: flutter pub get
        working-directory: mobile

      - name: "Build Flutter iOS IPA"
        run: flutter build ipa --release --no-codesign
        working-directory: mobile

      - name: "Install coreutils"
        run: |
          brew install coreutils || true
          echo "PATH=/opt/homebrew/bin:$PATH" >> $GITHUB_ENV
          echo "PATH=/usr/local/bin:$PATH" >> $GITHUB_ENV
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

      - name: "Setup .NET SDK for iOS Test API dependency"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: "Restore API dependencies for iOS Test"
        run: dotnet restore
        working-directory: api/ShiftGiving

      - name: "Run the API in background for iOS Test"
        id: start_api_server_for_ios
        env:
          JWT_SECRET: "test-secret-key-for-ci-minimum-32-characters-long"
          DATABASE_URL: "postgresql://shiftgiving:shiftgiving@localhost:5432/shiftgiving"
          ASPNETCORE_ENVIRONMENT: "Testing"
        run: |
          dotnet run --configuration Release --urls "http://localhost:5237" &
          echo "API_SERVER_PID_FOR_IOS=$!" >> $GITHUB_ENV
          timeout 60s bash -c 'until curl --silent --fail http://localhost:5237/health; do echo "Waiting for API..."; sleep 2; done' || { echo "API did not start in time for iOS Test!"; exit 1; }
          echo "API is up for iOS Test!"
        working-directory: api/ShiftGiving

      - name: Cleanup Simulators
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl erase all || true

      - name: "Launch iOS Simulator"
        id: launch_simulator
        run: |
            DEVICE_TYPE="iPhone 14"
            IOS_SIMULATOR_NAME="${DEVICE_TYPE} Simulator for CI"

            UDID=$(xcrun simctl list devices | grep "$IOS_SIMULATOR_NAME" | grep -v unavailable | awk -F '[()]' '{print $2}' | head -1)

            if [ -z "$UDID" ]; then
            RUNTIME_IDENTIFIER=$(xcrun simctl list runtimes | grep -E 'iOS' | grep -v 'unavailable' | tail -1 | awk -F ' ' '{print $NF}' | tr -d '[:space:]')
            echo "RUNTIME_IDENTIFIER: $RUNTIME_IDENTIFIER"
              UDID=$(xcrun simctl create "$IOS_SIMULATOR_NAME" "$DEVICE_TYPE" "$RUNTIME_IDENTIFIER")
            echo "Created new simulator: $UDID"
              else
            echo "Found existing simulator: $UDID"
              fi

            # Sanity check
            if [ -z "$UDID" ]; then
            echo "Could not determine simulator UDID. Failing."
            exit 1
            fi

            xcrun simctl boot "$UDID"
            echo "Booting simulator with UDID: $UDID"
            gtimeout 600 bash -c "until xcrun simctl bootstatus \"$UDID\" -d boot | grep -q 'booted'; do echo 'Still waiting for simulator...'; sleep 5; done"
            xcrun simctl list devices
            echo "Simulator is ready!"
            echo "IOS_SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
        working-directory: mobile

      - name: "Run iOS Mobile Tests"
        run: ./run_tests.sh
        working-directory: mobile
        timeout-minutes: 15

      - name: "Shutdown iOS Simulator"
        if: always()
        run: |
          if [ -n "${{ env.IOS_SIMULATOR_UDID }}" ]; then
            echo "Shutting down simulator with UDID: ${{ env.IOS_SIMULATOR_UDID }}"
            xcrun simctl shutdown "${{ env.IOS_SIMULATOR_UDID }}" || true
          else
            echo "Simulator UDID not found. Could not shut down explicitly."
          fi
        working-directory: mobile

      - name: "Stop the API Server for iOS Test"
        if: always()
        run: |
          if [ -n "${{ env.API_SERVER_PID_FOR_IOS }}" ]; then
            echo "Stopping API server for iOS Test with PID: ${{ env.API_SERVER_PID_FOR_IOS }}"
            kill "${{ env.API_SERVER_PID_FOR_IOS }}" || true
          else
            echo "API server PID for iOS Test not found. Could not stop explicitly."
          fi
  build-and-test-mobile-android:
    name: "Build & Test Mobile Android"
    if: false  # Disabled - focusing on web only
    runs-on: ubuntu-latest
    needs: build-and-test-api

    steps:
      - name: Cache Flutter SDK and Packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/flutter
            ~/.pub-cache
            mobile/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            mobile/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android Emulator AVDs
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
            ~/.android/emu-update-last-check.ini
            ~/.android/advancedFeatures.ini
            ~/.android/cache
          key: ${{ runner.os }}-avd

      - name: "Checkout repository code"
        uses: actions/checkout@v4

      - name: "Setup Flutter SDK"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: "Install Flutter dependencies"
        run: flutter pub get
        working-directory: mobile

      - name: "Build Flutter Android APK"
        run: flutter build apk --release --split-debug-info=build/symbols --no-tree-shake-icons --split-per-abi --verbose
        working-directory: mobile

      - name: "Enable KVM"
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: "Setup .NET SDK for Android Test API dependency"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Download API Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-out
          path: api/ShiftGiving/out

      - name: Make API binary executable
        run: chmod +x ./out/ShiftGiving
        working-directory: api/ShiftGiving

      - name: "Run the API in background for Android Test"
        id: start_api_server_for_android
        env:
          JWT_SECRET: "test-secret-key-for-ci-minimum-32-characters-long"
          DATABASE_URL: "postgresql://shiftgiving:shiftgiving@localhost:5432/shiftgiving"
          ASPNETCORE_ENVIRONMENT: "Testing"
        run: |
          ASPNETCORE_URLS=http://localhost:5237 ./out/ShiftGiving &
          echo "API_SERVER_PID_FOR_ANDROID=$!" >> $GITHUB_ENV
          timeout 60s bash -c 'until curl --silent --fail http://localhost:5237/health; do echo "Waiting for API..."; sleep 2; done' || { echo "API did not start in time for Android Test!"; exit 1; }
          echo "API is up for Android Test!"
        working-directory: api/ShiftGiving

      - name: "Launch Android Emulator and Run Tests"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          cores: 4
          profile: Nexus 5
          emulator-options: '-no-window -no-snapshot -no-audio -no-boot-anim -no-metrics'
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 300
          script: cd mobile/android && ./gradlew connectedCheck && cd ../ && ./run_tests.sh

      - name: "Stop the API Server for Android Test"
        if: always()
        run: |
          if [ -n "${{ env.API_SERVER_PID_FOR_ANDROID }}" ]; then
            echo "Stopping API server for Android Test with PID: ${{ env.API_SERVER_PID_FOR_ANDROID }}"
            kill "${{ env.API_SERVER_PID_FOR_ANDROID }}" || true
          else
            echo "API server PID for Android Test not found. Could not stop explicitly."
          fi
  # DEPLOYMENT - Deploy to AWS App Runner on push to main

  deploy-api-to-apprunner:
    name: "Deploy API to App Runner"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-and-test-api, build-and-test-web]
    environment: Production

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 338977415134.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: giving-app
      APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:us-east-1:338977415134:service/Giving/bb7051ff9d9a429a9d0f888df81b99fd
      HEALTH_CHECK_URL: https://6egddr9uvm.us-east-1.awsapprunner.com/health

    steps:
      - name: "Checkout repository code"
        uses: actions/checkout@v4

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Login to Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: "Build, tag, and push API image to Amazon ECR"
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f api/ShiftGiving/Dockerfile api/ShiftGiving
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: "Deploy to App Runner"
        run: |
          aws apprunner start-deployment \
            --service-arn $APP_RUNNER_SERVICE_ARN \
            --region $AWS_REGION

      - name: "Wait for deployment to complete"
        run: |
          echo "Waiting for App Runner deployment..."
          for i in {1..30}; do
            STATUS=$(aws apprunner describe-service \
              --service-arn $APP_RUNNER_SERVICE_ARN \
              --region $AWS_REGION \
              --query 'Service.Status' --output text)
            echo "Attempt $i: Status = $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "Deployment complete!"
              break
            elif [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ]; then
              echo "Deployment failed!"
              exit 1
            fi
            sleep 10
          done

      - name: "Verify health check"
        run: |
          curl -f $HEALTH_CHECK_URL || exit 1
          echo "Health check passed!"

  deploy-web-to-s3:
    name: "Deploy Web to S3/CloudFront"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-and-test-api, build-and-test-web]
    environment: Production

    env:
      AWS_REGION: us-east-1
      S3_BUCKET: shift-giving-web-app-bucket
      CLOUDFRONT_DISTRIBUTION_ID: E1SM7K53IIX4YZ

    steps:
      - name: "Checkout repository code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Install dependencies"
        run: npm install
        working-directory: web

      - name: "Build for production"
        run: npm run build
        working-directory: web

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Deploy to S3"
        run: |
          aws s3 sync dist s3://$S3_BUCKET --delete
          echo "Web app deployed to S3!"
        working-directory: web

      - name: "Invalidate CloudFront cache"
        run: |
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
          echo "CloudFront cache invalidated!"

      - name: "Verify web app deployment"
        run: |
          sleep 30
          curl -f https://giving.justyn.app || exit 1
          echo "Web app is live!"
